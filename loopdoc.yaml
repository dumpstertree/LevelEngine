Name: "LevelEngine"
Types:
    - Config:
      - field: "tile_type"
        type: "int"
      - field: "num_rooms"
        type: "int"
      - field: "min_width"
        type: "int"
      - field: "max_width" 
        type: "int"
      - field: "min_height" 
        type: "int"
      - field: "max_height" 
        type: "int"
      - field: "min_room_size" 
        type: "int"
      - field: "max_room_size" 
        type: "int"
      - field: "seed" 
        type: "int"
    - Tile:
      - field: "tile_type"
        type: "int" 
    - Map:
        - field: "tiles"
          type: "Tile[]"
        - field: "width"
          type: "int"
        - field: "height"
          type: "int" 
Ledger: []
Static: 
    name: "tile_type_for_location" 
    inputs:
        - field: "map"
          type: "Map" 
        - field: "location"
          type: "CurioCore:Vector2" 
    outputs:
        - field: "tile_type"
          type: "int" 
    name: "generate_level_data"
    inputs:
        - field: "min_map_size"
          type: "CurioCore:Vector2"
        - field: "max_map_size"
          type: "CurioCore:Vector2" 
        - field: "min_room_size"
          type: "CurioCore:Vector2"
        - field: "max_room_size"
          type: "CurioCore:Vector2" 
        - field: "num_rooms"
          type: "CurioCore:Vector2" 
    outputs:
        - field: "map"
          type: "Map" 
