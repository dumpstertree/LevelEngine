Requires: 
  - id: "core"
  - location: "https://github.com/dumpstertree/curio-engine"
Types:
    - Config:
      - field: "tile_type"
        type: "int"
      - field: "num_rooms"
        type: "int"
      - field: "min_width"
        type: "int"
      - field: "max_width" 
        type: "int"
      - field: "min_height" 
        type: "int"
      - field: "max_height" 
        type: "int"
      - field: "min_room_size" 
        type: "int"
      - field: "max_room_size" 
        type: "int"
      - field: "seed" 
        type: "int"
    - Tile:
      - field: "tile_type"
        type: "int" 
    - Map:
        - field: "tiles"
          type: "TileData[]"
        - field: "width"
          type: "int"
        - field: "height"
          type: "int" 
Ledger: []
Static: 
    name: "generate_level_data"
    inputs:
        - field: "min_map_size"
          type: "core:vector2"
        - field: "max_map_size"
          type: "core:vector2" 
        - field: "min_room_size"
          type: "core:vector2"
        - field: "max_room_size"
          type: "core:vector2" 
        - field: "num_rooms"
          type: "core:vector2" 
    outputs:
        - field: "level_data"
          type: "LevelData" 
